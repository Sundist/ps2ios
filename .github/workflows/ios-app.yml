name: ios-app
# End to end, with no commercial game data:
#   simulator      test ROM A -> its own iOS app -> runs in the iPhone simulator
#   universal-sim  universal player (built from ROM A) runs ROM B, a disc it was
#                  not built from, with the game code interpreted
#   universal-ipa  the universal player as an unsigned iPhone IPA (artifact; a
#                  GitHub release on a v* tag)
on:
  workflow_dispatch:
    inputs:
      renderer:
        description: "software or vulkan"
        default: software
      release_tag:
        description: "Publish the universal player as a GitHub release with this tag (e.g. v0.1.0). Empty = no release."
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["ps1ios/**", "ios/**", "testrom/**", ".github/workflows/ios-app.yml"]

jobs:
  testrom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mipsel-linux-gnu
      - run: testrom/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: testrom-disc
          path: testrom/build/*.zip

  simulator:
    needs: testrom
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: testrom-disc
          path: disc
      - name: Restore cache (psxrecomp checkout, generated project, CMake checks)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/psxrecomp
            build/src
            build/xcode
          key: ios-build-v2-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-build-v2-${{ hashFiles('testrom/**') }}-
      - name: Tools
        run: |
          brew install ninja || true
          python -m pip install numpy pillow
          xcodebuild -version
          xcrun simctl list runtimes
      - name: zip -> iOS app (simulator) -> run
        run: |
          python -m ps1ios build "disc/PS1 Test ROM.zip" --target simulator \
            --renderer "${{ github.event.inputs.renderer || 'software' }}" \
            --run-seconds 45 --pad-demo --name "PS1 Test" --work build --out out --human
      - name: Screenshot into the log (base64, downscaled)
        if: always()
        run: |
          for f in out/*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 "$f" --out shot_small.png >/dev/null
            echo "=== BEGIN SCREENSHOT $(basename "$f") ==="
            base64 -i shot_small.png | fold -w 180
            echo "=== END SCREENSHOT ==="
          done
      - name: Save cache (also after a failed build)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/psxrecomp
            build/src
            build/xcode
          key: ios-build-v2-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: |
            out/
            build/simulator.log
            build/disc_probe.json
          if-no-files-found: warn
      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/src/*/build*/CMakeFiles/*.log
            build/xcode/CMakeFiles/*.log
          if-no-files-found: ignore

  universal-sim:
    # One app for any PS1 disc: built from test ROM A, it must run test ROM B.
    needs: testrom
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: testrom-disc
          path: disc
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-uni/psxrecomp
            build-uni/src
            build-uni/xcode
          key: ios-uni-v1-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-uni-v1-${{ hashFiles('testrom/**') }}-
      - name: Tools
        run: |
          brew install ninja || true
          python -m pip install numpy pillow
      - name: universal player (simulator) runs a disc it was not built from
        run: |
          python -m ps1ios build "disc/PS1 Test ROM.zip" --universal --target simulator \
            --renderer software --run-disc "disc/PS1 Test ROM B.zip" --run-seconds 45 --pad-demo \
            --work build-uni --out out-uni --human
      - name: Screenshot into the log (base64, downscaled)
        if: always()
        run: |
          for f in out-uni/*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 "$f" --out shot_small.png >/dev/null
            echo "=== BEGIN SCREENSHOT $(basename "$f") ==="
            base64 -i shot_small.png | fold -w 180
            echo "=== END SCREENSHOT ==="
          done
      - name: Save cache (also after a failed build)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build-uni/psxrecomp
            build-uni/src
            build-uni/xcode
          key: ios-uni-v1-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-simulator-results
          path: |
            out-uni/
            build-uni/simulator.log
          if-no-files-found: warn

  universal-ipa:
    # The universal player as an unsigned iPhone IPA (arm64, iphoneos SDK), for
    # AltStore or Sideloadly to sign with the user's Apple ID. No Mac needed to use it.
    needs: testrom
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: testrom-disc
          path: disc
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-device/psxrecomp
            build-device/src
            build-device/xcode
          key: ios-device-v2-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-device-v2-${{ hashFiles('testrom/**') }}-
      - name: Tools
        run: |
          brew install ninja || true
          python -m pip install numpy pillow
      - name: universal player -> unsigned iPhone IPA
        run: |
          python -m ps1ios build "disc/PS1 Test ROM.zip" --universal --unsigned --renderer software \
            --work build-device --out out-device --human
          ls -la out-device
          unzip -l out-device/*.ipa | grep -vE "\.lproj|_CodeSignature" | tail -30
      - name: Save cache (also after a failed build)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build-device/psxrecomp
            build-device/src
            build-device/xcode
          key: ios-device-v2-${{ hashFiles('testrom/**') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ps1-player-unsigned-ipa
          path: out-device/*.ipa
      - name: GitHub release (a v* tag, or the release_tag input)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "PS1 Player $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out-device/ps1-player.ipa --clobber
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | .name + " " + (.size|tostring) + " bytes")'
